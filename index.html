    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-color: #f0f2f5;
        }
        /* 左侧菜单 */
        .sidebar {
            width: 280px;
            background-color: #252b37;
            color: white;
            padding:20px 0;
            overflow-y: auto;
        }
        .sidebar h2{
            text-align:center;
            margin-bottom:24px;
            font-size:20px;
        }
        .item{
            padding:14px 24px;
            cursor:pointer;
            transition: 0.25s;
        }
        .item:hover{
            background-color:#374151;
        }
        .item.active{
            background-color:#165DFF;
        }
        /* 右侧内容区 */
        .main{
            flex:1;
            padding:30px;
            overflow-y:auto;
        }
        .resource-card{
            background:#fff;
            padding:24px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #00000015;
            max-width:700px;
        }
        .resource-card h3{
            margin-bottom:16px;
            font-size:22px;
        }
        .version-item{
            padding:12px 10px;
            border-bottom: 1px solid #eee;
            cursor:pointer;
            transition: 0.2s;
        }
        .version-item:hover{
            background-color:#f3f4f6;
        }
        .hide{
            display:none;
        }
        /* 弹窗遮罩 */
        .modal-overlay{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.55);
            display:none;
            align-items:center;
            justify-content:center;
            z-index: 999;
        }
        .modal-box{
            width: 640px;
            max-height: 85vh;
            background:#ffffff;
            border-radius: 12px;
            overflow-y:auto;
        }
        .modal-desc{
            padding:24px;
        }
        .modal-desc h4{
            font-size:18px;
            margin-bottom:12px;
        }
        .modal-buttons{
            padding:20px 24px;
            border-top: 1px solid #eee;
            display:flex;
            gap:12px;
            flex-wrap: wrap;
        }
        .btn{
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            color:white;
            cursor:pointer;
            font-size:13px;
            text-decoration: none;
        }
        .btn-baidu{background-color:#2b78e4;}
        .btn-lanzou{background-color:#ff7800;}
        .btn-ali{background-color:#00b42a;}

    <script>
        const items = document.querySelectorAll('.item');
        const contents = document.querySelectorAll('.resource-content');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const btnBaidu = document.getElementById('btn-baidu');
        const btnLanzou = document.getElementById('btn-lanzou');
        const btnAli = document.getElementById('btn-ali');
        const btnMediafire = document.getElementById('btn-mediafire');
        const btnGithub = document.getElementById('btn-github');
        const btnOnedrive = document.getElementById('btn-onedrive');
        const btnQuark = document.getElementById('btn-quark');
        const btnXunlei = document.getElementById('btn-xunlei');
        const btnWeiyun = document.getElementById('btn-weiyun');
        const btn123 = document.getElementById('btn-123');
        const closeModal = document.getElementById('closeModal');
        //左侧切换
        items.forEach(el=>{
            el.onclick = function(){
                items.forEach(i=>i.classList.remove('active'));
                this.classList.add('active');
                let targetId = this.dataset.id;
                contents.forEach(c=>c.classList.add('hide'));
                document.getElementById(targetId).classList.remove('hide');
            }
        })
        //点击版本打开弹窗
        document.querySelectorAll('.version-item').forEach(el=>{
            el.onclick = function(){
                modalTitle.innerText = this.dataset.title;
                modalDesc.innerText = this.dataset.desc;
                btnBaidu.href = this.dataset.baidu;
                btnLanzou.href = this.dataset.lanzou;
                btnAli.href = this.dataset.ali;
                btnMediafire.href = this.dataset.mediafire;
                btnGithub.href = this.dataset.github;
                btnOnedrive.href = this.dataset.onedrive;
                btnQuark.href = this.dataset.quark;
                btnXunlei.href = this.dataset.xunlei;
                btnWeiyun.href = this.dataset.weiyun;
                btn123.href = this.dataset['123'];
                modal.style.display = 'flex';
            }
        })
        //关闭弹窗
        closeModal.onclick = function(){
            modal.style.display = 'none';
        }
        //点击遮罩关闭弹窗
        modal.onclick = function(e){
            if(e.target === modal){
                modal.style.display = 'none';
            }
        }
    </script>
